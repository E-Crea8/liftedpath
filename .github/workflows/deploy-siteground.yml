# Deploy the WordPress theme to SiteGround.
# Run from Actions → Deploy to SiteGround. The Next.js app in frontend/ is not synced.

name: Deploy to SiteGround

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select deployment target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - live
          - both
      confirm_deployment:
        description: 'Type "DEPLOY" to confirm deployment'
        required: true
        type: string
      deploy_mode:
        description: 'Deployment mode. With no commit range, changed_files uploads the whole theme.'
        required: true
        default: 'changed_files'
        type: choice
        options:
          - changed_files
          - specific_files
          - full
      commit_range:
        description: 'Commit range (e.g., 677a07e..499619a) or leave empty for last commit'
        required: false
        type: string
        default: ''
      specific_files:
        description: 'Theme paths for specific_files mode, separated by commas or new lines'
        required: false
        type: string
        default: ''

concurrency:
  group: siteground-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  confirm:
    name: Confirm Deployment
    runs-on: ubuntu-latest
    outputs:
      deploy_staging: ${{ steps.check.outputs.deploy_staging }}
      deploy_live: ${{ steps.check.outputs.deploy_live }}
    steps:
      - name: Check confirmation
        id: check
        env:
          CONFIRM: ${{ github.event.inputs.confirm_deployment }}
          TARGET: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "Deployment cancelled. Type DEPLOY to confirm. Received: '${CONFIRM}'"
            exit 1
          fi

          echo "Deployment confirmed."
          case "$TARGET" in
            staging)
              echo "deploy_staging=true" >> "$GITHUB_OUTPUT"
              echo "deploy_live=false" >> "$GITHUB_OUTPUT"
              ;;
            live)
              echo "deploy_staging=false" >> "$GITHUB_OUTPUT"
              echo "deploy_live=true" >> "$GITHUB_OUTPUT"
              ;;
            both)
              echo "deploy_staging=true" >> "$GITHUB_OUTPUT"
              echo "deploy_live=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown deployment target: ${TARGET}"
              exit 1
              ;;
          esac

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: confirm
    if: needs.confirm.outputs.deploy_staging == 'true'
    env:
      SSH_HOST: ${{ secrets.SITEGROUND_HOST }}
      SSH_PORT: ${{ secrets.SITEGROUND_PORT }}
      SSH_USER: ${{ secrets.SITEGROUND_USER }}
      THEME_PATH: ${{ secrets.SITEGROUND_PATH }}
      WP_PATH: ${{ secrets.SITEGROUND_WP_PATH }}
      DEPLOY_MODE: ${{ github.event.inputs.deploy_mode }}
      COMMIT_RANGE: ${{ github.event.inputs.commit_range }}
      SPECIFIC_FILES: ${{ github.event.inputs.specific_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$THEME_PATH" ]; then
            echo "Staging needs these repository secrets: SITEGROUND_SSH_KEY, SITEGROUND_HOST, SITEGROUND_USER, SITEGROUND_PATH."
            exit 1
          fi
          if [ -z "$SSH_PORT" ]; then
            echo "SSH_PORT=18765" >> "$GITHUB_ENV"
          else
            echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          ssh-keyscan -p "${SSH_PORT:-18765}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/siteground_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "echo 'SSH connection to staging succeeded.'"

      - name: Choose theme files
        id: files
        run: |
          set -euo pipefail
          : > /tmp/deploy_files.txt

          theme_paths() {
            grep -E '\.(php|css|js|html|json|svg|woff2|txt|png)$' \
              | grep -v -E '^(frontend/|\.github/)' \
              | grep -v -E '^(README\.md|AGENTS\.md|CLAUDE\.md)$' \
              || true
          }

          if [ "$DEPLOY_MODE" = "changed_files" ]; then
            if [ -n "$COMMIT_RANGE" ]; then
              echo "Detecting theme files in range: $COMMIT_RANGE"
              git diff --name-only --diff-filter=ACMR "$COMMIT_RANGE" | theme_paths > /tmp/deploy_files.txt
            else
              echo "No commit range was given, so the whole theme is deployed."
              echo "Uploading only the last commit can omit a file the theme already loads and take WordPress down."
              echo "mode=full" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ ! -s /tmp/deploy_files.txt ]; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "No theme files in that range. frontend/ is left for Vercel."
              exit 0
            fi
            echo "mode=selective" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOY_MODE" = "specific_files" ]; then
            printf '%s\n' "$SPECIFIC_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > /tmp/deploy_files.txt
            if [ ! -s /tmp/deploy_files.txt ]; then
              echo "specific_files mode needs at least one theme path."
              exit 1
            fi
            echo "mode=selective" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

          if [ -s /tmp/deploy_files.txt ]; then
            echo "Files selected:"
            cat /tmp/deploy_files.txt
            while IFS= read -r path; do
              case "$path" in
                frontend/*|.github/*)
                  echo "Refusing to deploy ${path} to SiteGround."
                  exit 1
                  ;;
              esac
              if [ ! -e "$path" ]; then
                echo "Missing path: ${path}"
                exit 1
              fi
            done < /tmp/deploy_files.txt
          fi

      - name: Deploy theme to staging
        run: |
          set -euo pipefail
          MODE="${{ steps.files.outputs.mode }}"
          REMOTE="${SSH_USER}@${SSH_HOST}:${THEME_PATH}"
          SSH_CMD="ssh -i ~/.ssh/siteground_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          if [ "$MODE" = "skip" ]; then
            echo "Staging deploy skipped. No theme files changed."
            exit 0
          fi

          ssh -i ~/.ssh/siteground_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p $(printf '%q' "$THEME_PATH")"

          if [ "$MODE" = "selective" ]; then
            echo "Deploying selected theme files to staging..."
            rsync -avz --files-from=/tmp/deploy_files.txt \
              -e "$SSH_CMD" \
              ./ "$REMOTE"
          else
            echo "Full theme deploy to staging. frontend/ stays off this server."
            rsync -avz \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='frontend' \
              --exclude='node_modules' \
              --exclude='.DS_Store' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='*.log' \
              --exclude='README.md' \
              --exclude='AGENTS.md' \
              --exclude='CLAUDE.md' \
              --exclude='deploy-sample.yml' \
              --exclude='Lifted Path Design System.md' \
              --exclude='LICENSE' \
              --exclude='phpcs.xml.dist' \
              --exclude='context' \
              --exclude='logos' \
              --exclude='liftedpath-design-main' \
              --exclude='Six-File+Context+Methodology' \
              -e "$SSH_CMD" \
              ./ "$REMOTE"
          fi

      - name: Clear WordPress cache (staging)
        run: |
          set -euo pipefail
          if [ -z "$WP_PATH" ]; then
            echo "SITEGROUND_WP_PATH is empty. Cache flush skipped."
            exit 0
          fi
          ssh -i ~/.ssh/siteground_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "cd $(printf '%q' "$WP_PATH") && wp cache flush" || echo "Cache flush skipped."

      - name: Staging deployment complete
        run: echo "Staging theme deploy finished."

  deploy-live:
    name: Deploy to Live (Production)
    runs-on: ubuntu-latest
    needs: confirm
    if: needs.confirm.outputs.deploy_live == 'true'
    env:
      SSH_HOST: ${{ secrets.SITEGROUND_LIVE_HOST }}
      SSH_PORT: ${{ secrets.SITEGROUND_LIVE_PORT }}
      SSH_USER: ${{ secrets.SITEGROUND_LIVE_USER }}
      THEME_PATH: ${{ secrets.SITEGROUND_LIVE_PATH }}
      WP_PATH: ${{ secrets.SITEGROUND_LIVE_WP_PATH }}
      DEPLOY_MODE: ${{ github.event.inputs.deploy_mode }}
      COMMIT_RANGE: ${{ github.event.inputs.commit_range }}
      SPECIFIC_FILES: ${{ github.event.inputs.specific_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_LIVE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$THEME_PATH" ]; then
            echo "Live needs these repository secrets: SITEGROUND_LIVE_SSH_KEY, SITEGROUND_LIVE_HOST, SITEGROUND_LIVE_USER, SITEGROUND_LIVE_PATH."
            exit 1
          fi
          if [ -z "$SSH_PORT" ]; then
            echo "SSH_PORT=18765" >> "$GITHUB_ENV"
          else
            echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/siteground_live_key
          chmod 600 ~/.ssh/siteground_live_key
          ssh-keyscan -p "${SSH_PORT:-18765}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/siteground_live_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "echo 'SSH connection to live succeeded.'"

      - name: Choose theme files
        id: files
        run: |
          set -euo pipefail
          : > /tmp/deploy_files.txt

          theme_paths() {
            grep -E '\.(php|css|js|html|json|svg|woff2|txt|png)$' \
              | grep -v -E '^(frontend/|\.github/)' \
              | grep -v -E '^(README\.md|AGENTS\.md|CLAUDE\.md)$' \
              || true
          }

          if [ "$DEPLOY_MODE" = "changed_files" ]; then
            if [ -n "$COMMIT_RANGE" ]; then
              echo "Detecting theme files in range: $COMMIT_RANGE"
              git diff --name-only --diff-filter=ACMR "$COMMIT_RANGE" | theme_paths > /tmp/deploy_files.txt
            else
              echo "No commit range was given, so the whole theme is deployed."
              echo "Uploading only the last commit can omit a file the theme already loads and take WordPress down."
              echo "mode=full" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ ! -s /tmp/deploy_files.txt ]; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "No theme files in that range. frontend/ is left for Vercel."
              exit 0
            fi
            echo "mode=selective" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOY_MODE" = "specific_files" ]; then
            printf '%s\n' "$SPECIFIC_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > /tmp/deploy_files.txt
            if [ ! -s /tmp/deploy_files.txt ]; then
              echo "specific_files mode needs at least one theme path."
              exit 1
            fi
            echo "mode=selective" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

          if [ -s /tmp/deploy_files.txt ]; then
            echo "Files selected:"
            cat /tmp/deploy_files.txt
            while IFS= read -r path; do
              case "$path" in
                frontend/*|.github/*)
                  echo "Refusing to deploy ${path} to SiteGround."
                  exit 1
                  ;;
              esac
              if [ ! -e "$path" ]; then
                echo "Missing path: ${path}"
                exit 1
              fi
            done < /tmp/deploy_files.txt
          fi

      - name: Deploy theme to live
        run: |
          set -euo pipefail
          MODE="${{ steps.files.outputs.mode }}"
          REMOTE="${SSH_USER}@${SSH_HOST}:${THEME_PATH}"
          SSH_CMD="ssh -i ~/.ssh/siteground_live_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          if [ "$MODE" = "skip" ]; then
            echo "Live deploy skipped. No theme files changed."
            exit 0
          fi

          ssh -i ~/.ssh/siteground_live_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p $(printf '%q' "$THEME_PATH")"

          if [ "$MODE" = "selective" ]; then
            echo "Deploying selected theme files to live..."
            rsync -avz --files-from=/tmp/deploy_files.txt \
              -e "$SSH_CMD" \
              ./ "$REMOTE"
          else
            echo "Full theme deploy to live. frontend/ stays off this server."
            rsync -avz \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='frontend' \
              --exclude='node_modules' \
              --exclude='.DS_Store' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='*.log' \
              --exclude='README.md' \
              --exclude='AGENTS.md' \
              --exclude='CLAUDE.md' \
              --exclude='deploy-sample.yml' \
              --exclude='Lifted Path Design System.md' \
              --exclude='LICENSE' \
              --exclude='phpcs.xml.dist' \
              --exclude='context' \
              --exclude='logos' \
              --exclude='liftedpath-design-main' \
              --exclude='Six-File+Context+Methodology' \
              -e "$SSH_CMD" \
              ./ "$REMOTE"
          fi

      - name: Clear WordPress cache (live)
        run: |
          set -euo pipefail
          if [ -z "$WP_PATH" ]; then
            echo "SITEGROUND_LIVE_WP_PATH is empty. Cache flush skipped."
            exit 0
          fi
          ssh -i ~/.ssh/siteground_live_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "cd $(printf '%q' "$WP_PATH") && wp cache flush" || echo "Cache flush skipped."

      - name: Live deployment complete
        run: echo "Live theme deploy finished."

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [confirm, deploy-staging, deploy-live]
    if: always()
    steps:
      - name: Summary
        env:
          CONFIRM_RESULT: ${{ needs.confirm.result }}
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          LIVE_RESULT: ${{ needs.deploy-live.result }}
        run: |
          echo "=========================================="
          echo "        DEPLOYMENT SUMMARY"
          echo "=========================================="
          if [ "$CONFIRM_RESULT" != "success" ]; then
            echo "Confirmation did not pass. Nothing was deployed."
          fi
          case "$STAGING_RESULT" in
            success) echo "STAGING: Finished" ;;
            skipped) echo "STAGING: Skipped" ;;
            *) echo "STAGING: Failed" ;;
          esac
          case "$LIVE_RESULT" in
            success) echo "LIVE: Finished" ;;
            skipped) echo "LIVE: Skipped" ;;
            *) echo "LIVE: Failed" ;;
          esac
          echo "=========================================="
